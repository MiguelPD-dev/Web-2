<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Alunos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Sistema de Cadastro de Alunos</h1>
        </header>

        <main>
            <section class="card">
                <h2>Cadastrar Novo Aluno</h2>
                <form id="form-aluno">
                    <div class="form-group">
                        <label for="nome">Nome Completo:</label>
                        <input type="text" id="nome" placeholder="Ex: Ana da Silva" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="matricula">Matrícula:</label>
                            <input type="text" id="matricula" placeholder="Ex: 12345678" required>
                        </div>
                        <div class="form-group">
                            <label for="curso">Curso:</label>
                            <input type="text" id="curso" placeholder="Ex: Informática" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="periodo">Período:</label>
                            <input type="number" id="periodo" min="1" max="20" placeholder="Ex: 3" required>
                        </div>
                        <div class="form-group">
                            <label for="media">Média (0 a 10):</label>
                            <input type="number" id="media" step="0.1" min="0" max="10" placeholder="Ex: 8.5" required>
                        </div>
                    </div>

                    <button type="submit" id="btn-cadastrar">Cadastrar Aluno</button>
                </form>
            </section>

            <section class="card stats-card">
                <h2>Estatísticas da Turma</h2>
                <div class="stats-grid">
                    <div class="stat-box">
                        <span class="stat-label">Quantidade de Alunos</span>
                        <span id="total-alunos" class="stat-value">0</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label">Média Geral da Turma</span>
                        <span id="media-geral" class="stat-value">0.00</span>
                    </div>
                </div>
            </section>

            <section class="card">
                <h2>Alunos Cadastrados</h2>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>Matrícula</th>
                                <th>Curso</th>
                                <th>Período</th>
                                <th>Média</th>
                            </tr>
                        </thead>
                        <tbody id="corpo-tabela">
                            </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
