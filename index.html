<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Trabalho - Cadastro de Alunos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 id="titulo">Sistema de Cadastro da Turma</h1>

    <div id="caixa-cadastro" class="caixa">
        <h2>Cadastrar Aluno</h2>
        
        <label>Nome:</label><br>
        <input type="text" id="nome"><br><br>

        <label>Matrícula:</label><br>
        <input type="text" id="matricula"><br><br>

        <label>Curso:</label><br>
        <input type="text" id="curso"><br><br>

        <label>Período:</label><br>
        <input type="number" id="periodo"><br><br>

        <label>Média:</label><br>
        <input type="number" id="media"><br><br>

        <button onclick="cadastrarAluno()">Salvar Aluno</button>
    </div>

    <div id="caixa-estatisticas" class="caixa">
        <h2>Estatísticas</h2>
        <p>Quantidade de alunos: <strong id="qtd-alunos">0</strong></p>
        <p>Média geral da turma: <strong id="media-turma">0.00</strong></p>
    </div>

    <div id="caixa-tabela" class="caixa">
        <h2>Lista de Alunos</h2>
        <table border="1" id="tabela">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Matrícula</th>
                    <th>Curso</th>
                    <th>Período</th>
                    <th>Média</th>
                </tr>
            </thead>
            <tbody id="corpo-tabela">
                </tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
